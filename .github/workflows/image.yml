name: image
# builds and pushes the OCI image(s) on every push to main and on tags; skipped until a Dockerfile exists.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write }
concurrency: { group: "image-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "df=$(ls Dockerfile* 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.df == ''
        run: echo "no Dockerfile yet"
      - if: steps.has.outputs.df != ''
        uses: docker/setup-buildx-action@v3
      - if: steps.has.outputs.df != ''
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: steps.has.outputs.df != ''
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.has.outputs.df }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - if: steps.has.outputs.df != ''
        uses: sigstore/cosign-installer@v3
      - if: steps.has.outputs.df != ''
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
      - if: steps.has.outputs.df != ''
        run: echo "digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.has.outputs.df != ''
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
