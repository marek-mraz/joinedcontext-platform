apiVersion: joinedcontext.com/v1alpha1
kind: UiSchema
metadata:
  name: endpoint
  namespace: org
spec:
  for: Endpoint                      # the kind whose form this arranges
  order: [name, slug, audience, enabledRepresentations, caching]
  groups:                            # visual grouping of a flat schema
    - title: { sk: "Základ", en: "Basics" }
      fields: [name, slug]
    - title: { sk: "Prístup", en: "Access" }
      description: { sk: "Kto smie čítať", en: "Who may read" }
      fields: [audience, enabledRepresentations]
  fields:
    slug:
      widget: text
      help: { sk: "Neuhádnuteľná adresa endpointu", en: "The unguessable address" }
      placeholder: "26 znakov"
      columns: 6                     # of twelve
      readOnly: false
      advanced: false
    enabledRepresentations:
      widget: checkboxes
    commitMessage:
      advanced: true                 # hidden outside the advanced mode (CC-29)
