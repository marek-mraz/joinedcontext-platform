[package]
name = "jcctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0" }
aes-gcm = "0.10"
age = { version = "0.12", default-features = false, features = ["armor"] }
base64 = "0.22"
jsonschema = { version = "0.54", default-features = false }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
zeroize = "1"

[dev-dependencies]
aes-gcm = "0.10"
age = { version = "0.12", features = ["armor"] }
base64 = "0.22"
sha2 = "0.10"
