[package]
name = "jcctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0" }
jsonschema = { version = "0.54", default-features = false }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tracing = "0.1"
walkdir = "2"
