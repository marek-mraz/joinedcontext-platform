[package]
name = "context-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jc-core = { path = "../jc-core", version = "0.1.0", features = ["axum"] }
jcctl = { path = "../jcctl", version = "0.1.0" }
arc-swap = "1"
argon2 = "0.5"
axum = "0.8"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
# sha256 for the schema surface's strong ETags; jsonwebtoken already links it
ring = "0.17"
# xlsx is a zip of XML parts: the XML is written here, the container is not worth rewriting
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# a throwaway signing key per test run, so no private key is ever written into the repo
base64 = "0.22"
serde_norway = "0.9"
# `oneshot`, so the tenancy middleware is tested through a real tower stack.
tower = { version = "0.5", features = ["util"] }
# the workbook is read back part by part, so the test asserts a package rather than bytes
zip = { version = "2", default-features = false, features = ["deflate"] }
# `test-util` pauses the clock, so the reaper's five-second bound is measured
# without a test that actually sleeps for five seconds.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
